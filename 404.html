    @font-face{font-family:'Plus Jakarta Sans';src:url('/assets/fonts/jakarta-regular.ttf') format('truetype');font-weight:400 500;font-display:swap}
    *,*::before,*::after{box-sizing:border-box}
    html{scroll-behavior:smooth}
    body{margin:0;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#f6fbf3;color:#023616;font-family:'Plus Jakarta Sans',sans-serif;font-size:16px;line-height:1.7;-webkit-font-smoothing:antialiased;padding:40px 24px;text-align:center}
    .label{font-size:11px;font-weight:700;letter-spacing:.12em;color:#586853;text-transform:uppercase;margin:0 0 28px}
    h1{font-family:Outfit,sans-serif;font-size:clamp(38px,6vw,66px);font-weight:400;line-height:1.1;letter-spacing:-.035em;margin:0 0 18px;text-wrap:balance;max-width:560px}
    p{color:#414e41;font-size:15px;max-width:400px;margin:0 auto 36px;text-wrap:balance}
    .actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center}
    .btn{display:inline-flex;align-items:center;gap:16px;min-height:56px;padding:15px 25px;border-radius:6px;background:#023616;color:#fff;font-size:14px;font-weight:600;font-family:inherit;line-height:1.4;text-decoration:none;transition:background .25s,transform .4s cubic-bezier(.16,1,.3,1);white-space:nowrap}
    .btn:hover{background:#1e4d2b}
    .btn:active{transform:scale(.98)}
    .btn-outline{background:transparent;color:#023616;box-shadow:inset 0 0 0 1px #cbd8c5}
    .btn-outline:hover{background:#e4eedf}
    .site-footer{margin-top:64px;font-size:12px;color:#586853}
    @media(max-width:480px){h1{font-size:clamp(34px,8vw,50px)}.actions{flex-direction:column;align-items:center}.btn{width:min(280px,100%);justify-content:center}}
